# The same suite the pre-commit hook runs, run again on the server.
#
# The hook can be skipped with --no-verify, and is skipped by anyone who
# clones without running scripts/install-hooks.sh. This is the copy that
# cannot be skipped.
#
# scripts/ip_audit.js is deliberately NOT here: it needs the ETS corpus,
# which must never be committed. That one stays a local step before release.
name: qa

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # v6 is the current major (v6.4.0, April 2026); v5 still works and is
      # one behind. Pinned to the major so patch releases arrive without a
      # commit here, which is the trade GitHub's own docs recommend.
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
      # No install step and none wanted: the suite is plain Node scripts
      # against one HTML file, so there is no build to break.
      #
      # No cache either, and that is measured rather than assumed: checkout is
      # already shallow, the 28 MB it brings is the audio the suite has to read
      # to check it, and a cache of files that come with the checkout saves
      # nothing. Caching would only pay if the audio moved out of the repo.
      - run: sh scripts/qa.sh
